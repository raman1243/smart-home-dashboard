
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Smart Home Dashboard</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
text-align:center;
margin:0;
padding:0;
}

h1{
margin-top:25px;
}

#loginForm{
max-width:400px;
margin:50px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

#loginForm input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

#loginForm button{
width:100%;
padding:12px;
background:#2196F3;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#dashboard{
display:none;
}

.relay-container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
width:250px;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.card h2{
margin-top:0;
}

.card button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
color:white;
background:#2196F3;
}

.sensor{
font-size:35px;
font-weight:bold;
color:#2196F3;
}

#allOffBtn,
#logoutBtn{
padding:12px 25px;
margin:10px;
border:none;
border-radius:8px;
cursor:pointer;
color:white;
}

#allOffBtn{
background:#e53935;
}

#logoutBtn{
background:#555;
}

</style>
</head>

<body>

<h1>ESP8266 Smart Home Dashboard</h1>

<!-- LOGIN -->

<div id="loginForm">

<input
type="email"
id="email"
placeholder="Firebase Email">

<input
type="password"
id="password"
placeholder="Firebase Password">

<button id="loginBtn">
Login
</button>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="relay-container">

<!-- Relay 1 -->

<div class="card">

<h2>Relay 1</h2>

<p>Status:
<b id="status1">OFF</b>
</p>

<button id="btn1">
Toggle Relay 1
</button>

</div>

<!-- Relay 2 -->

<div class="card">

<h2>Relay 2</h2>

<p>Status:
<b id="status2">OFF</b>
</p>

<button id="btn2">
Toggle Relay 2
</button>

</div>

<!-- Temperature -->

<div class="card">

<h2>🌡 Temperature</h2>

<div
class="sensor"
id="temperature">
0
</div>

<p>°C</p>

</div>

<!-- Humidity -->

<div class="card">

<h2>💧 Humidity</h2>

<div
class="sensor"
id="humidity">
0
</div>

<p>%</p>

</div>

</div>

<button id="allOffBtn">
All OFF
</button>

<button id="logoutBtn">
Logout
</button>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>

// Firebase Config

const firebaseConfig = {
  apiKey: "AIzaSyCk6pKt5vlk1W8MYHN50SUrbHNMLZB4tpw",
  authDomain: "smart-home-1ad10.firebaseapp.com",
  databaseURL: "https://smart-home-1ad10-default-rtdb.firebaseio.com",
  projectId: "smart-home-1ad10",
  storageBucket: "smart-home-1ad10.firebasestorage.app",
  messagingSenderId: "568760208190",
  appId: "1:568760208190:web:622dbbb63eac422b01fa6f",
  measurementId: "G-9MS0MVPS0B"
};

firebase.initializeApp(firebaseConfig);

// Elements

const loginBtn =
document.getElementById("loginBtn");

const loginForm =
document.getElementById("loginForm");

const dashboard =
document.getElementById("dashboard");

// Login

loginBtn.onclick = ()=>{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

firebase.auth()
.signInWithEmailAndPassword(
email,
password
)

.then(()=>{

loginForm.style.display="none";

dashboard.style.display="block";

startDashboard();

})

.catch((error)=>{

alert(error.message);

});

};

// Dashboard

function startDashboard(){

const db =
firebase.database();

// Relay 1

const relay1Ref =
db.ref("/relay1");

relay1Ref.on(
"value",
(snapshot)=>{

const state =
snapshot.val();

document.getElementById(
"status1"
).innerHTML =
state ? "ON" : "OFF";

document.getElementById(
"btn1"
).style.background =
state ? "green" : "#2196F3";

}
);

document.getElementById(
"btn1"
).onclick=()=>{

relay1Ref.get()
.then((snap)=>{

relay1Ref.set(
!snap.val()
);

});

};

// Relay 2

const relay2Ref =
db.ref("/relay2");

relay2Ref.on(
"value",
(snapshot)=>{

const state =
snapshot.val();

document.getElementById(
"status2"
).innerHTML =
state ? "ON" : "OFF";

document.getElementById(
"btn2"
).style.background =
state ? "green" : "#2196F3";

}
);

document.getElementById(
"btn2"
).onclick=()=>{

relay2Ref.get()
.then((snap)=>{

relay2Ref.set(
!snap.val()
);

});

};

// Temperature

db.ref("/temperature")
.on("value",
(snapshot)=>{

document.getElementById(
"temperature"
).innerHTML =
snapshot.val() || 0;

});

// Humidity

db.ref("/humidity")
.on("value",
(snapshot)=>{

document.getElementById(
"humidity"
).innerHTML =
snapshot.val() || 0;

});

// All OFF

document.getElementById(
"allOffBtn"
).onclick=()=>{

relay1Ref.set(false);

relay2Ref.set(false);

};

}

// Logout

document.getElementById(
"logoutBtn"
).onclick=()=>{

firebase.auth()
.signOut()
.then(()=>{

dashboard.style.display=
"none";

loginForm.style.display=
"block";

});

};

</script>

</body>
</html>
